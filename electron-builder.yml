appId: ro.raporteco.desktop
productName: Raport Eco
copyright: Copyright © 2026 Raport Eco
# Refuses to package if any standalone FFmpeg tool slipped into the app.
afterPack: scripts/check-package.cjs
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: app
    to: app
    filter:
      - '**/*'
      # Audio is converted by Chromium in the renderer; a leftover local
      # ffmpeg.exe must never be shipped (GPL licence, unused).
      - '!bin/ffmpeg.exe'
      # Part of the whisper.cpp release but not needed by whisper-cli
      # (verified 2026-11-08: a full transcription runs without them).
      - '!bin/SDL2.dll'
      - '!bin/parakeet.dll'
      - '!**/.gitkeep'
# Full licence texts of every bundled component, next to Electron's own
# LICENSE.electron.txt and LICENSES.chromium.html. scripts/check-package.cjs
# fails the build if a shipped binary or model is not listed in it.
extraFiles:
  - from: legal/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: Raport-Eco-Setup.exe
  # Intended purpose, terms and privacy notice (also shown in the app).
  license: legal/termeni.txt
portable:
  artifactName: Raport-Eco-Portable.exe
